[project]
name = "mcp-platform-python"
version = "0.1.0"
description = "Python MCP runtime, core services, and external data connectors"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.13.0,<2",
    "python-dotenv>=1.1.1",
    "xmltodict>=0.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
