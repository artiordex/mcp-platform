# Codex (~/.codex/config.toml) MCP 서버 등록 스니펫

# 1. mcp-platform 전체 통합 게이트웨이 (RAG + 나라장터 + 공공데이터)
[mcp_servers.mcp-platform]
command = "/bin/bash"
args = ["__MCP_PLATFORM_ROOT__/scripts/run-mcp-gateway.sh"]

# 2. 로컬 워크스페이스 파일 탐색 도구 (읽기 전용)
[mcp_servers.workspace-tools]
command = "node"
args = ["__MCP_PLATFORM_ROOT__/dist/servers/workspace-tools.js"]

[mcp_servers.workspace-tools.env]
MCP_WORKSPACE_ROOT = "__WORKSPACE_ROOT__"
